name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Comprobar estructura del proyecto
        run: |
          echo "== Árbol del repositorio =="
          find . -maxdepth 3 -not -path './.git*' | sort
          MISSING=0
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml app/fixed.keystore; do
            if [ ! -f "$f" ]; then
              echo "::error::Falta $f en el repositorio"
              MISSING=1
            fi
          done
          exit $MISSING

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle 8.10.2 con caché
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generar Gradle Wrapper si falta
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: Verificar compilación y análisis estático (Lint)
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Compilar APK (Debug y Release)
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Preparar artefactos con versión
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/SatelliteWallpaper-v${V}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "dist/SatelliteWallpaper-v${V}-release.apk"
          echo "name=SatelliteWallpaper-v${V}" >> "$GITHUB_OUTPUT"

      - name: Subir APKs compilados
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
