name: Android CI - Build & APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.9 y caché
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Subir APK compilado como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: SatelliteWallpaper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publicar Release automático al crear etiqueta (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/debug/*.apk \
            --title "Satellite Wallpaper ${{ github.ref_name }}" \
            --generate-notes
