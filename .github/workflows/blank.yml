name: Android CI - Build & APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Configurar Gradle y caché
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Localizar proyecto y compilar APK Debug
        run: |
          PROJECT_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts en el repositorio."
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Compilando proyecto en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Subir APK compilado como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: SatelliteWallpaper-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release automático al crear etiqueta (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          gh release create "${{ github.ref_name }}" \
            "$APK_PATH" \
            --title "Satellite Wallpaper ${{ github.ref_name }}" \
            --generate-notes
